plugins { id 'com.android.application' }

android {
    namespace 'app.span.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.span.android'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // Testing/open-source convenience: sign release APK with the standard
            // Android debug key so GitHub Actions can produce an installable APK
            // without storing a private release keystore in the repository.
            // Replace this with a real signingConfig backed by GitHub Secrets
            // before Play Store or production distribution.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
