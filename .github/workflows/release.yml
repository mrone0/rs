name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: span
            archive: span-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: span
            archive: span-macos-x64.tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: span.exe
            archive: span-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: span
            archive: span-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p span

      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 == ''
        run: |
          codesign --force --sign - target/${{ matrix.target }}/release/${{ matrix.bin }}
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/span-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          IDENTITY="$MACOS_SIGNING_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          fi
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application signing identity found" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Developer ID sign macOS binary
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" target/${{ matrix.target }}/release/${{ matrix.bin }}
          codesign --verify --verbose=2 target/${{ matrix.target }}/release/${{ matrix.bin }}

      - name: Notarize macOS binary
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != '' && env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          mkdir -p dist/notary
          ditto -c -k --keepParent target/${{ matrix.target }}/release/${{ matrix.bin }} dist/notary/span-notary.zip
          xcrun notarytool submit dist/notary/span-notary.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          # Raw CLI binaries cannot always be stapled like .app/.pkg/.dmg,
          # but the notarization ticket is available online to Gatekeeper.
          xcrun stapler staple target/${{ matrix.target }}/release/${{ matrix.bin }} || true
          spctl --assess --type execute --verbose=4 target/${{ matrix.target }}/release/${{ matrix.bin }} || true

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/span
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/span/
          cp README.md docs/pc-mvp.md docs/discovery-protocol.md dist/span/
          tar -czf dist/${{ matrix.archive }} -C dist span

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/span | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/span/
          Copy-Item README.md dist/span/
          Copy-Item docs/pc-mvp.md dist/span/
          Copy-Item docs/discovery-protocol.md dist/span/
          Compress-Archive -Path dist/span -DestinationPath dist/${{ matrix.archive }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/${{ matrix.archive }}

  android-apk:
    name: Build android-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Test and build APKs
        run: |
          cd apps/android
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Stage Android artifacts
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/span-android-debug.apk
          cp apps/android/app/build/outputs/apk/release/app-release.apk dist/span-android-release-debug-signed.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/span-android-debug.apk
            dist/span-android-release-debug-signed.apk

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'desktop-*'
          merge-multiple: true

      - name: List release assets
        run: find dist -maxdepth 2 -type f -print | sort

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true

  attach-android-release-assets:
    name: Attach Android APKs to Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android-apk, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Attach Android APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true

  publish-npm:
    name: Publish npm desktop installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Align npm version with Git tag
        working-directory: npm/span-desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Publish span-desktop
        working-directory: npm/span-desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag test
          else
            npm publish --access public
          fi
