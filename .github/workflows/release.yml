name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: rs-cp-daemon
            archive: rs-cp-macos-arm64.tar.gz
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: rs-cp-daemon
            archive: rs-cp-macos-x64.tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rs-cp-daemon.exe
            archive: rs-cp-windows-x64.zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rs-cp-daemon
            archive: rs-cp-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p rs-cp-daemon

      - name: Stage Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/rs-cp
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/rs-cp/
          cp README.md docs/pc-mvp.md docs/discovery-protocol.md dist/rs-cp/
          tar -czf dist/${{ matrix.archive }} -C dist rs-cp

      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rs-cp | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/rs-cp/
          Copy-Item README.md dist/rs-cp/
          Copy-Item docs/pc-mvp.md dist/rs-cp/
          Copy-Item docs/discovery-protocol.md dist/rs-cp/
          Compress-Archive -Path dist/rs-cp -DestinationPath dist/${{ matrix.archive }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.archive }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}
